# ASIM 配置 — 安装时只在 /data/adb/asim/asim.conf 不存在时复制，升级不覆盖。
# 槽位是 SIM slot id（dumpsys isub 的 simSlotIndex，从 0 开始），不是 subId。
# slot 0 = 联通/Lebara（不要放进来）；slot 1 = CTExcel（目标卡）。
SLOTS="1"

# asim-relay 的地址（只用于状态面板/节点配置，取不到不影响防驻网）。
# 留空 = 自动用手机当前默认网关；中继装在电脑上时填电脑的 LAN 地址。
ROUTER_API=""
ROUTER_TOKEN="3f9c1c7a5b2e4d6f8a0b1c2d3e4f5a6b"
