# ASIM 路由器侧配置片段（OpenWrt / mihomo）
#
# 作用：只把 EE ePDG（CTExcel 的 VoWiFi 网关）的流量送英国节点，其余原样直连。
# 依据：系统 IWLAN 的 IKE/IPsec 由手机基带执行、不经过手机 IP 栈（见 m0/M0-B-FINDINGS.md），
#       所以拦截点只能放在路由器上。
#
# 用哪条规则：
#   * 默认只用 IP-CIDR（31.94.76.0/24 = 实测 EE ePDG 段）——不动 DNS，对其他设备零影响。
#   * 若哪天 ePDG 换了网段（PDN 建不起来 + 手机日志里 ePDG 解析出别的 IP），
#     把下面的 DOMAIN-SUFFIX 规则打开，并确保 dns.enable + dns-hijack 生效（会让
#     LAN 客户端 DNS 走 mihomo，blast radius 变大）。

proxies:
  - { name: ASIM-UK01, type: trojan, server: pokemon888-go.pikaholo.com, port: 56006,
      password: a24d95eb-e678-448d-a098-1a1248927c31, udp: true,
      sni: iosapps.itunes.apple.com, skip-cert-verify: true }

# TUN 接管本机转发流量（OpenWrt 需 kmod-tun；若你的 mihomo 已用 TPROXY，则无需本节）
tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true
  dns-hijack: []          # 不动 LAN 客户端 DNS

# 默认关闭 mihomo 自己的 DNS，避免影响手机与其他设备
dns:
  enable: false

rules:
  # 必须放在最前面
  - IP-CIDR,31.94.76.0/24,ASIM-UK01,no-resolve
  # - DOMAIN-SUFFIX,3gppnetwork.org,ASIM-UK01          # 仅在需要时启用
  # - DOMAIN-SUFFIX,epdg.epc.mnc033.mcc234.pub.3gppnetwork.org,ASIM-UK01

  # 其余保持你原来的规则；没有的话：
  - MATCH,DIRECT
